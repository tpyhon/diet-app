services:
  - type: web
    name: diet-app-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        value: gemini-1.5-flash
      - key: PYTHON_VERSION
        value: "3.11.9"
